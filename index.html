<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart QR Check-in System - Premium</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/241/241528.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root { 
            --nav-h: 75px; 
            --primary: #4f46e5; 
            --primary-dark: #3730a3;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-soft: #f8fafc;
        }
        @media (max-width: 767px) { :root { --nav-h: 140px; } }

        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; margin: 0; padding-top: var(--nav-h); color: #1e293b; }
        
        /* Premium Spinner */
        .app-loader { width: 45px; height: 45px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Navbar */
        .navbar { position: fixed; top: 0; width: 100%; z-index: 2000; height: var(--nav-h); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .staff-tag { background: var(--primary); color: #ffffff; padding: 4px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.5px; }
        
        .nav-tabs-custom { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 12px; }
        .nav-tabs-custom .btn-toggle { border: none; background: transparent; padding: 6px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; color: var(--secondary); transition: 0.2s; }
        .nav-tabs-custom .btn-toggle.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        /* Layout */
        .app-wrapper { display: flex; height: calc(100vh - var(--nav-h)); }
        .panel-left { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .sidebar-right { width: 450px; background: #ffffff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; }

        @media (max-width: 991px) {
            body { height: auto; overflow-y: auto; }
            .app-wrapper { flex-direction: column; height: auto; }
            .sidebar-right { width: 100%; border-left: none; border-top: 1px solid #e2e8f0; }
        }

        /* Statistics Card */
        .stats-area { padding: 20px; background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .stats-card { background: var(--bg-soft); border-radius: 20px; padding: 15px; border: 1px solid #e2e8f0; }
        .progress { height: 8px; border-radius: 10px; background-color: #e2e8f0; }
        .progress-bar { background: linear-gradient(90deg, var(--primary), var(--success)); }

        /* Scanner */
        .scanner-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 2.5rem; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .cam-view { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 1.5rem; overflow: hidden; position: relative; border: 5px solid #f8fafc; }
        
        /* Manual Input */
        .manual-box { display: flex; background: #f1f5f9; border-radius: 1rem; padding: 6px; margin-top: 20px; border: 1px solid #e2e8f0; }
        .manual-box input { flex: 1; border: none; background: transparent; padding: 10px 15px; font-weight: 500; outline: none; }
        .manual-box button { background: #1e293b; color: white; border: none; border-radius: 0.8rem; padding: 10px 25px; font-weight: 600; }

        /* Timer Banner */
        #timer-banner { display: none; width: 100%; max-width: 500px; margin-bottom: 20px; padding: 15px; border-radius: 1.2rem; font-weight: 600; text-align: center; }
        .status-closed { background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c; }
        .status-open { background: #dcfce7; border: 1px solid #bbf7d0; color: #15803d; }

        /* List Items */
        .history-list { flex: 1; overflow-y: auto; padding: 20px; }
        .id-item { display: flex; align-items: center; background: #ffffff; border: 1px solid #f1f5f9; border-radius: 1.2rem; padding: 15px; margin-bottom: 12px; transition: 0.3s; }
        .id-item:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-color: var(--primary); }

        /* Profile in Modal */
        .profile-box { width: 140px; height: 170px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; background: #f8fafc; border-radius: 20px; border: 4px solid #ffffff; overflow: hidden; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .profile-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Login Screen */
        #login-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #4f46e5, #1e293b); }
        .login-card { width: 100%; max-width: 420px; background: white; border-radius: 3rem; padding: 45px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        
        #splash-screen { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e293b; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="app-loader mb-3"></div>
        <div class="text-white small fw-bold">SYSTEM BOOTING...</div>
    </div>

    <!-- ===== LOGIN SCREEN (Logic เดิม) ===== -->
    <div id="login-screen">
        <div class="login-card">
            <div class="mb-4">
                <div class="staff-tag d-inline-block mb-3">ADMINISTRATION</div>
                <h3 class="fw-bold">Staff Login</h3>
                <p class="text-muted small">ระบบลงทะเบียนและตรวจสอบข้อมูล</p>
            </div>
            
            <div class="position-relative mb-3">
                <i class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                <input type="password" id="staff-id" class="form-control form-control-lg border-0 bg-light" placeholder="รหัสผ่านเจ้าหน้าที่" style="padding-left: 45px; border-radius: 15px;" oninput="this.value = this.value.replace(/[ก-๙]/g, '')">
                <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="togglePassword" style="cursor:pointer"></i>
            </div>
            <div id="login-error-msg" class="text-danger small mb-3 fw-bold" style="display:none"></div>

            <button onclick="login()" id="login-btn" class="btn btn-primary btn-lg w-100 py-3 rounded-4 shadow-lg">
                <span id="login-text">เข้าสู่ระบบ <i class="fa-solid fa-arrow-right ms-2"></i></span>
                <span id="login-loader" class="d-none"><span class="spinner-border spinner-border-sm me-2"></span> ตรวจสอบ...</span>
            </button>
        </div>
    </div>

    <!-- ===== PREVIEW MODAL (Logic เดิม: แสดงข้อมูลจ่ายเงิน/สแกนซ้ำ/รูป) ===== -->
    <div class="modal fade" id="previewModal" data-bs-backdrop="static" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 30px;">
                <div class="modal-header border-0 pb-0"><h5 class="fw-bold mx-auto">ข้อมูลผู้เข้าร่วมประชุม</h5></div>
                <div class="modal-body text-center p-4">
                    <div class="profile-box">
                        <img id="p-img" src="" style="display: none;" alt="profile">
                        <i id="p-icon" class="fa-solid fa-user-tie fa-4x text-light"></i>
                    </div>
                    
                    <h3 id="p-name" class="fw-bold mb-1 text-dark">-</h3>
                    <div id="p-scanned-info" class="text-danger small fw-bold mb-3 d-none">
                        <i class="fa-regular fa-calendar-xmark me-1"></i> สแกนไปแล้วเมื่อ: <span id="p-scanned-time"></span>
                    </div>

                    <div class="bg-light p-3 rounded-4 text-start mb-4 mt-3">
                        <div class="row mb-2">
                            <div class="col-5 text-secondary small">ประเภท</div>
                            <div id="p-regType" class="col-7 fw-bold small">-</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-5 text-secondary small">ตำแหน่ง</div>
                            <div id="p-pos" class="col-7 fw-bold small">-</div>
                        </div>
                        <div id="pay-status-area">
                            <hr class="my-2 opacity-10">
                            <div class="row">
                                <div class="col-5 text-secondary small">สถานะการชำระเงิน</div>
                                <div id="p-status" class="col-7 fw-bold small">-</div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btn-confirm-record" class="btn btn-success py-3 rounded-4 fw-bold fs-5 shadow-sm">
                            <i class="fa-solid fa-circle-check me-2"></i>ยืนยันลงชื่อ
                        </button>
                        <button class="btn btn-light py-3 rounded-4 fw-bold text-secondary" data-bs-dismiss="modal">
                            ยกเลิก / สแกนใหม่
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <div class="staff-tag">STAFF</div>
                <div>
                    <h6 class="mb-0 fw-bold">QR Check-in</h6>
                    <small id="ui-staff" class="text-primary fw-bold">...</small>
                </div>
            </div>

            <div class="d-flex gap-3 align-items-center">
                <div class="nav-tabs-custom d-none d-md-flex">
                    <button onclick="changeDay(1)" id="day1-btn" class="btn-toggle active">วันที่ 1</button>
                    <button onclick="changeDay(2)" id="day2-btn" class="btn-toggle">วันที่ 2</button>
                </div>
                <div class="nav-tabs-custom d-none d-md-flex">
                    <button onclick="changeSession('am')" id="am-btn" class="btn-toggle active">รอบเช้า</button>
                    <button onclick="changeSession('pm')" id="pm-btn" class="btn-toggle">รอบบ่าย</button>
                </div>
                <!-- Mobile Selectors -->
                <div class="d-md-none d-flex gap-1">
                    <select class="form-select form-select-sm rounded-3" id="mobile-day" onchange="changeDay(this.value)">
                        <option value="1">วันที่ 1</option>
                        <option value="2">วันที่ 2</option>
                    </select>
                    <select class="form-select form-select-sm rounded-3" id="mobile-session" onchange="changeSession(this.value)">
                        <option value="am">เช้า</option>
                        <option value="pm">บ่าย</option>
                    </select>
                </div>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-3 px-3 fw-bold">ออก</button>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="app-wrapper">
        <main class="panel-left">
            <div id="timer-banner"></div>
            
            <div class="scanner-card">
                <div class="cam-view mb-3">
                    <canvas id="canvas" hidden></canvas>
                    <div id="placeholder" class="h-100 d-flex flex-column align-items-center justify-content-center text-white opacity-25">
                        <i class="fa-solid fa-camera fa-3x mb-3"></i>
                        <span class="fw-bold">READY TO SCAN</span>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button id="start-btn" onclick="toggleScanner(true)" class="btn btn-primary py-3 rounded-4 fw-bold fs-5 shadow-sm">
                        เริ่มสแกน QR Code
                    </button>
                    <button id="stop-btn" onclick="toggleScanner(false)" class="btn btn-danger py-3 rounded-4 fw-bold fs-5 d-none">
                        หยุดสแกน
                    </button>
                </div>

                <div class="manual-box shadow-sm">
                    <input type="text" id="manual-input" placeholder="กรอกรหัส ID..." autocomplete="off" onkeydown="if(event.key==='Enter'){ event.preventDefault(); handleManual(); }">
                    <button onclick="handleManual()">บันทึก</button>
                </div>
            </div>
        </main>

        <aside class="sidebar-right">
            <!-- Stats Dashboard -->
            <div class="stats-area">
                <div class="stats-card">
                    <div class="d-flex justify-content-between align-items-end mb-2">
                        <div>
                            <small class="text-secondary fw-bold">ความคืบหน้าการลงทะเบียน</small>
                            <h3 class="fw-bold mb-0"><span id="ui-present">0</span> <small class="fs-6 text-muted fw-normal">/ <span id="ui-total">0</span></small></h3>
                        </div>
                        <div class="text-end">
                            <span id="ui-percent" class="badge bg-primary rounded-pill">0%</span>
                        </div>
                    </div>
                    <div class="progress mb-2">
                        <div id="ui-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="d-flex justify-content-between small">
                        <span class="text-muted">คงเหลือ: <b id="ui-remaining">0</b></span>
                        <span class="text-primary fw-bold" id="ui-session-text">วันที่ 1 (เช้า)</span>
                    </div>
                </div>
            </div>

            <div class="p-3 border-bottom">
                <div class="position-relative">
                    <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="history-search" class="form-control border-0 bg-light" placeholder="ค้นหาชื่อ หรือ รหัส ID..." style="padding-left: 45px; border-radius: 12px;" oninput="filterHistory()">
                </div>
            </div>

            <div id="history-box" class="history-list">
                <!-- รายการจะมาแสดงตรงนี้ -->
            </div>
        </aside>
    </div>

    <video id="video" playsinline hidden></video>

    <script>
        // ใช้ GAS_URL เดิมของคุณ
        const GAS_URL = "https://script.google.com/macros/s/AKfycbydE1LUZOhCjm9dPCSYE-o90as2kSBh00T0iZExNQ-kvPLAH2fbiCCr7IFCP5-M_eEZ/exec"; 
        let day = 1, session = 'am', staff = null, isScanning = false, currentStream = null, previewModal = null;
        const video = document.getElementById("video"), canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");

        // Unified Loader Function
        const showGlobalLoading = (msg = 'กำลังอัปเดตข้อมูล...') => {
            Swal.fire({
                html: `<div class="app-loader mb-3"></div><div class="fw-bold">${msg}</div>`,
                allowOutsideClick: false, showConfirmButton: false, didOpen: () => { Swal.showLoading(); }
            });
        }

        window.onload = async () => {
            previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
            const splash = document.getElementById('splash-screen');
            const savedStaff = localStorage.getItem('staff_session');

            if (savedStaff) {
                staff = JSON.parse(savedStaff);
                document.getElementById('login-screen').classList.add('d-none');
                document.getElementById('ui-staff').innerText = `เจ้าหน้าที่: ${staff.name}`;
                await updateData(false);
            }
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
            
            // Password Toggle Logic
            const togglePassword = document.getElementById('togglePassword');
            const staffInput = document.getElementById('staff-id');
            togglePassword.addEventListener('click', function() {
                const type = staffInput.getAttribute('type') === 'password' ? 'text' : 'password';
                staffInput.setAttribute('type', type);
                this.classList.toggle('fa-eye'); this.classList.toggle('fa-eye-slash');
            });
        };

        async function updateData(showSpinner = true) {
            if (showSpinner) showGlobalLoading();
            await Promise.all([checkCurrentDay(), fetchHistory()]);
            if (showSpinner) Swal.close();
        }

        // --- Logic หลัก (คงเดิมจากไฟล์ต้นฉบับ) ---

        async function login() {
            const id = document.getElementById('staff-id').value.trim();
            if (!id) return;
            const btn = document.getElementById('login-btn');
            const text = document.getElementById('login-text');
            const loader = document.getElementById('login-loader');
            
            btn.disabled = true; text.classList.add('d-none'); loader.classList.remove('d-none');
            
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStaffPrivilege', PASSWARD: id }) });
                const result = await res.json();
                if (result.isAllowed) {
                    staff = result;
                    localStorage.setItem('staff_session', JSON.stringify(result));
                    document.getElementById('login-screen').classList.add('d-none');
                    document.getElementById('ui-staff').innerText = `เจ้าหน้าที่: ${staff.name}`;
                    updateData(true);
                } else {
                    const errorMsg = document.getElementById('login-error-msg');
                    errorMsg.innerHTML = `<i class="fa-solid fa-circle-exclamation me-1"></i> ${result.message}`;
                    errorMsg.style.display = 'block';
                }
            } catch (e) { Swal.fire('Error', 'การเชื่อมต่อล้มเหลว', 'error'); }
            btn.disabled = false; text.classList.remove('d-none'); loader.classList.add('d-none');
        }

        function changeDay(d) {
            day = parseInt(d);
            document.getElementById('day1-btn').classList.toggle('active', day === 1);
            document.getElementById('day2-btn').classList.toggle('active', day === 2);
            document.getElementById('mobile-day').value = day;
            updateData(true);
        }

        function changeSession(s) {
            session = s;
            document.getElementById('am-btn').classList.toggle('active', session === 'am');
            document.getElementById('pm-btn').classList.toggle('active', session === 'pm');
            document.getElementById('mobile-session').value = session;
            updateData(true);
        }

        async function checkCurrentDay() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getTimerSettings' }) });
                const timerData = await res.json();
                if (!timerData.success) return;

                const now = new Date().getTime();
                const config = (day === 1) ? timerData.registrationTime.day1 : timerData.registrationTime.day2;
                const activeSession = config[session];
                
                const banner = document.getElementById('timer-banner');
                const btnStart = document.getElementById('start-btn');
                const sessionLabel = session === 'am' ? 'เช้า' : 'บ่าย';
                document.getElementById('ui-session-text').innerText = `วันที่ ${day} (รอบ${sessionLabel})`;

                if (!activeSession.start) {
                    banner.className = 'status-closed';
                    banner.innerHTML = `<i class="fa-solid fa-clock me-2"></i> ยังไม่ได้กำหนดเวลา`;
                    btnStart.disabled = true;
                } else if (now < activeSession.start) {
                    banner.className = 'status-closed';
                    banner.innerHTML = `<i class="fa-solid fa-clock me-2"></i> ⏳ ยังไม่ถึงเวลาลงทะเบียน`;
                    btnStart.disabled = true;
                } else if (now > activeSession.end) {
                    banner.className = 'status-closed';
                    banner.innerHTML = `<i class="fa-solid fa-circle-xmark me-2"></i> ❌ ปิดรับลงทะเบียนแล้ว`;
                    btnStart.disabled = true;
                } else {
                    banner.className = 'status-open';
                    banner.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i> ✅ เปิดรับลงทะเบียนปกติ`;
                    btnStart.disabled = false;
                }
                banner.style.display = 'block';
            } catch (e) { console.error(e); }
        }

        async function previewUser(id) {
            showGlobalLoading('กำลังตรวจสอบข้อมูล...');
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getUserPreview', id: id, day: day, session: session }) });
                const result = await res.json();
                Swal.close();
                if (result.success) {
                    const u = result.user;
                    document.getElementById('p-name').innerText = u.name;
                    document.getElementById('p-regType').innerText = u.regType || '-';
                    document.getElementById('p-pos').innerText = u.position || '-';
                    document.getElementById('p-status').innerText = u.payStatus || '-';
                    
                    // Profile Image Logic (รักษาไว้)
                    const pImg = document.getElementById('p-img');
                    const pIcon = document.getElementById('p-icon');
                    if (u.image) { pImg.src = u.image; pImg.style.display = 'block'; pIcon.style.display = 'none'; }
                    else { pImg.style.display = 'none'; pIcon.style.display = 'block'; }

                    const btn = document.getElementById('btn-confirm-record');
                    const scannedInfoArea = document.getElementById('p-scanned-info');
                    const scannedTimeText = document.getElementById('p-scanned-time');

                    if (result.isAlreadyScanned) {
                        btn.disabled = true;
                        btn.className = 'btn btn-secondary py-3 rounded-4 w-100';
                        btn.innerHTML = `<i class="fa-solid fa-check-double me-2"></i>บันทึกไปแล้ว`;
                        scannedInfoArea.classList.remove('d-none');
                        scannedTimeText.innerText = result.scannedTime;
                    } 
                    else if (u.regType === "สำหรับผู้ลงทะเบียนภายนอก" && u.payStatus !== "ชำระเงินเรียบร้อย") {
                        scannedInfoArea.classList.add('d-none');
                        btn.disabled = true;
                        btn.className = 'btn btn-danger py-3 rounded-4 w-100';
                        btn.innerHTML = `<i class="fa-solid fa-ban me-2"></i>ยังไม่ได้ชำระเงิน`;
                    } 
                    else {
                        scannedInfoArea.classList.add('d-none');
                        btn.disabled = false;
                        btn.className = 'btn btn-success py-3 rounded-4 w-100 shadow-sm';
                        btn.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>ยืนยันลงชื่อเข้างาน`;
                        btn.onclick = () => record(id, false);
                    }
                    previewModal.show();
                } else {
                    Swal.fire('ไม่พบข้อมูล', result.message, 'error');
                }
            } catch (e) { Swal.fire('Error', e.toString(), 'error'); }
        }

        async function record(qrText, confirmSkip) {
            previewModal.hide();
            showGlobalLoading('กำลังบันทึกข้อมูล...');
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'recordAttendance', data: { text: qrText, day, session, confirmSkip, staffInfo: staff } }) });
                const result = await res.json();
                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: result.user.name, timer: 1500, showConfirmButton: false });
                    fetchHistory();
                } else if (result.requireConfirm) {
                    Swal.fire({ 
                        title: 'ยืนยันการบันทึก?', 
                        text: result.message, 
                        icon: 'warning', 
                        showCancelButton: true, 
                        confirmButtonText: 'ยืนยันบันทึก', 
                        confirmButtonColor: '#10b981' 
                    }).then(r => { if (r.isConfirmed) record(qrText, true); });
                } else { 
                    Swal.fire('แจ้งเตือน', result.message, 'warning'); 
                }
            } catch (e) { Swal.fire('Error', e.toString(), 'error'); }
        }

        async function fetchHistory() {
            const box = document.getElementById('history-box');
            // Inline Spinner while loading list
            box.innerHTML = `<div class="text-center py-5"><div class="app-loader mb-2"></div><div class="text-muted small">กำลังโหลดรายการ...</div></div>`;

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getRecentRecords', data: { day, session } }) });
                const result = await res.json();
                if (result.success) {
                    // Update Stats Dashboard
                    const present = result.present || 0;
                    const total = result.total || 0;
                    const percent = total > 0 ? Math.round((present / total) * 100) : 0;
                    
                    document.getElementById('ui-present').innerText = present;
                    document.getElementById('ui-total').innerText = total;
                    document.getElementById('ui-remaining').innerText = total - present;
                    document.getElementById('ui-percent').innerText = percent + '%';
                    document.getElementById('ui-progress-bar').style.width = percent + '%';

                    if (result.records.length > 0) {
                        box.innerHTML = result.records.map(r => `
                            <div class="id-item shadow-sm">
                                <div class="flex-grow-1">
                                    <h6 class="mb-1 fw-bold text-dark">${r.name}</h6>
                                    <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>${r.time}</small>
                                </div>
                                <i class="fa-solid fa-circle-check fa-2x text-success ms-3"></i>
                            </div>
                        `).join('');
                    } else {
                        box.innerHTML = '<p class="text-center py-5 text-muted small fw-bold">--- ยังไม่มีข้อมูลการสแกน ---</p>';
                    }
                    filterHistory();
                }
            } catch (e) { console.error(e); }
        }

        // --- Camera & Utility Logic (คงเดิม) ---

        async function toggleScanner(start) {
            if (start) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = currentStream; video.play(); isScanning = true;
                    document.getElementById('start-btn').classList.add('d-none');
                    document.getElementById('stop-btn').classList.remove('d-none');
                    document.getElementById('placeholder').classList.add('d-none');
                    canvas.hidden = false; requestAnimationFrame(tick);
                } catch (e) { Swal.fire('Error', 'ไม่สามารถเข้าถึงกล้องได้', 'error'); }
            } else {
                if(currentStream) currentStream.getTracks().forEach(t => t.stop());
                isScanning = false;
                document.getElementById('start-btn').classList.remove('d-none');
                document.getElementById('stop-btn').classList.add('d-none');
                canvas.hidden = true; document.getElementById('placeholder').classList.remove('d-none');
            }
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    if (navigator.vibrate) navigator.vibrate(100);
                    toggleScanner(false); previewUser(code.data); return;
                }
            }
            if (isScanning) requestAnimationFrame(tick);
        }

        function handleManual() {
            const val = document.getElementById('manual-input').value.trim();
            if (val) { previewUser(val); document.getElementById('manual-input').value = ''; }
        }

        function filterHistory() {
            const query = document.getElementById('history-search').value.toLowerCase().trim();
            const items = document.querySelectorAll('.id-item');
            items.forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function logout() {
            Swal.fire({ title: 'ออกจากระบบ?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ตกลง' }).then(r => {
                if (r.isConfirmed) { localStorage.removeItem('staff_session'); location.reload(); }
            });
        }
    </script>
</body>
